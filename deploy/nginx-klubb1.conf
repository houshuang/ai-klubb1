# Klubb1 Tivoli. Included inside the alifstian.duckdns.org HTTPS server block.
# Public by design (a youth club uses it), but narrow: static files plus an
# explicit API prefix with rate limiting and small bodies.

location /klubb1 { return 301 /klubb1/; }

location ^~ /klubb1/api/ {
    limit_req zone=klubb1_api burst=40 nodelay;
    limit_except GET POST { deny all; }
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:3005/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;          # SSE streaming from Spørrespeilet
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

location ^~ /klubb1/ {
    alias /opt/klubb1/web/;
    index index.html;
    add_header Cache-Control "no-cache";
}
