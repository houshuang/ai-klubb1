<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oppgave-automaten — Klubb1 Tivoli</title>
<meta name="description" content="Velg 15, 30 eller 60 minutter, dra i spaken, få en oppgave som lærer deg ett nytt AI-grep.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency=".015" numOctaves="1" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
</svg>

<div class="page">
  <nav class="nav">
    <a href="./">← Tivoliet</a>
    <div class="links"><a href="speil.html">Spørrespeilet</a><a href="https://github.com/houshuang/ai-klubb1">Kode</a></div>
  </nav>

  <section class="machine mt2">
    <form class="cabinet" id="cabinet">
      <div class="title">
        <div class="caps">Legg på en mynt · velg · dra i spaken</div>
        <h1>Oppgave-automaten</h1>
        <div class="sub">Én lapp. Ett nytt AI-grep. Noe å vise fram.</div>
      </div>

      <div class="panel">
        <div class="lab">Hvor lang tid har du?</div>
        <div class="coins" role="radiogroup" aria-label="Tid">
          <label><input type="radio" name="minutter" value="15"><span class="coin">15<small>minutter</small></span></label>
          <label><input type="radio" name="minutter" value="30" checked><span class="coin">30<small>minutter</small></span></label>
          <label><input type="radio" name="minutter" value="60"><span class="coin">60<small>minutter</small></span></label>
        </div>
      </div>

      <div class="panel">
        <div class="lab">Hva har du lyst på?</div>
        <div class="seg" role="radiogroup" aria-label="Kategori">
          <label><input type="radio" name="kategori" value="overrask" checked><span class="stub">Overrask meg</span></label>
          <label><input type="radio" name="kategori" value="lyd"><span class="stub">Lyd & musikk</span></label>
          <label><input type="radio" name="kategori" value="bilde"><span class="stub">Bilde & film</span></label>
          <label><input type="radio" name="kategori" value="ord"><span class="stub">Ord & historier</span></label>
          <label><input type="radio" name="kategori" value="spill"><span class="stub">Spill & kode</span></label>
          <label><input type="radio" name="kategori" value="hamar"><span class="stub">Hamar & verden</span></label>
          <label><input type="radio" name="kategori" value="kropp"><span class="stub">Scene & kropp</span></label>
        </div>
      </div>

      <div class="panel">
        <div class="lab">Hvor vant er du med AI?</div>
        <div class="seg" role="radiogroup" aria-label="Nivå">
          <label><input type="radio" name="niva" value="nybegynner"><span class="stub">Nybegynner<span class="tiny">har mest stilt spørsmål til ChatGPT</span></span></label>
          <label><input type="radio" name="niva" value="vant" checked><span class="stub">Vant<span class="tiny">har laget bilder, lyd eller små apper</span></span></label>
          <label><input type="radio" name="niva" value="nerd"><span class="stub">Nerd<span class="tiny">bygger ting, vil ha friksjon</span></span></label>
        </div>
      </div>

      <div class="panel">
        <div class="lab">Alene eller sammen?</div>
        <div class="seg" role="radiogroup" aria-label="Alene eller gruppe">
          <label><input type="radio" name="gruppe" value="0" checked><span class="stub">Alene</span></label>
          <label><input type="radio" name="gruppe" value="1"><span class="stub">Gruppe (2–4)</span></label>
        </div>
      </div>

      <div class="panel">
        <div class="lab">Et ønske til automaten? (valgfritt)</div>
        <input class="field" type="text" name="onske" maxlength="300" placeholder="f.eks. «noe med katter», «vi har bare mobil», «vi er i parken»">
      </div>

      <div class="lever-wrap">
        <button class="lever" type="submit" id="lever" aria-label="Dra i spaken">
          <svg viewBox="0 0 120 150" fill="none" stroke="#15120e" stroke-width="3" stroke-linecap="round">
            <rect x="40" y="108" width="40" height="20" rx="3" fill="#15120e"/>
            <g class="arm">
              <line x1="60" y1="118" x2="60" y2="30" stroke-width="6"/>
              <circle cx="60" cy="22" r="14" fill="#ece6d6"/>
              <circle cx="60" cy="22" r="7" fill="#15120e"/>
            </g>
            <circle cx="60" cy="118" r="6" fill="#ece6d6"/>
          </svg>
        </button>
        <div class="hint">Dra i spaken</div>
      </div>
      <div class="slot" aria-hidden="true"></div>
    </form>
  </section>

  <div class="ticket-wrap" id="out"></div>

  <footer>Klubb1 Tivoli · <a href="https://aiklubb1.no">AI-klubb1</a> · Hamar</footer>
</div>

<script src="app.js"></script>
<script>
(() => {
  const { fetchJSON, esc, store, clack, renderTicket } = window.Tivoli;
  const form = document.getElementById("cabinet");
  const lever = document.getElementById("lever");
  const out = document.getElementById("out");

  // remember last settings
  const saved = store.get("automat.valg");
  if (saved) {
    for (const [k, v] of Object.entries(saved)) {
      const el = form.querySelector(`[name="${k}"][value="${v}"]`);
      if (el) el.checked = true;
    }
  }

  const gears = `<svg class="gears" viewBox="0 0 100 100" fill="none" stroke="#15120e" stroke-width="3"><g><circle cx="38" cy="50" r="16"/><path d="M38 26v-8M38 82v-8M14 50h-8M62 50h-8M21 33l-6-6M55 67l-6-6M55 33l6-6M21 67l-6-6"/></g><g><circle cx="70" cy="34" r="10"/><path d="M70 18v-6M70 50v-6M54 34h-6M86 34h-6"/></g></svg>`;

  function thinking() {
    out.innerHTML = `<div class="thinking">${gears}Automaten tenker<span class="dots"></span><br><span class="muted" style="letter-spacing:.05em;text-transform:none;font-size:12px">Den blander medium, tema og en vri. Tar noen sekunder.</span></div>`;
  }

  async function show(task) {
    out.innerHTML = renderTicket(task);
    clack("ding");
    if (task.id) history.replaceState(null, "", `?id=${task.id}`);
    setTimeout(() => out.scrollIntoView({ behavior: "smooth", block: "start" }), 250);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const body = {
      minutter: Number(fd.get("minutter")),
      kategori: fd.get("kategori"),
      niva: fd.get("niva"),
      gruppe: fd.get("gruppe") === "1",
      onske: (fd.get("onske") || "").trim(),
    };
    store.set("automat.valg", { minutter: body.minutter, kategori: body.kategori, niva: body.niva, gruppe: fd.get("gruppe") });

    lever.classList.add("pulled");
    lever.disabled = true;
    clack("lever");
    form.classList.add("rattle");
    thinking();
    try {
      const task = await fetchJSON("oppgave", { method: "POST", body: JSON.stringify(body) });
      await show(task);
    } catch (err) {
      out.innerHTML = `<div class="error">☹ ${esc(err.message)}</div>`;
    } finally {
      form.classList.remove("rattle");
      lever.disabled = false;
      setTimeout(() => lever.classList.remove("pulled"), 300);
    }
  });

  // deep link to a printed ticket
  const id = new URLSearchParams(location.search).get("id");
  if (id) {
    fetchJSON(`oppgave/${encodeURIComponent(id)}`).then(show).catch((err) => {
      out.innerHTML = `<div class="error">☹ ${esc(err.message)}</div>`;
    });
  }
})();
</script>
</body>
</html>
